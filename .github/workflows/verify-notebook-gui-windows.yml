name: Verify notebook window workflow on Windows
on:
  push:
    branches: [capy/verify-notebook-gui-a3cdac3d]
permissions:
  contents: read
jobs:
  window:
    if: github.repository == 'ArnoGevorkyan/zed'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PRODUCT_SHA: a3cdac3d5d5cc07b732499116bc3de0177755e1f
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: a3cdac3d5d5cc07b732499116bc3de0177755e1f
          path: product
          persist-credentials: false
      - name: Verify product revision and hosted runner
        shell: pwsh
        run: |
          if ((git -C product rev-parse HEAD) -ne $env:PRODUCT_SHA) { throw 'Unexpected product checkout' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires a standard GitHub-hosted runner' }
          git -C product log -1 --format='%H %s'
          [Environment]::OSVersion.VersionString
          "Runner: $env:RUNNER_NAME ($env:ImageOS $env:ImageVersion)"
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "NOTEBOOK_ROOT=$(Join-Path $env:RUNNER_TEMP 'notebook-gui')" >> $env:GITHUB_ENV
      - name: Restore the editor built from the product revision
        id: binary
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: notebook-gui-zed-debug-${{ env.PRODUCT_SHA }}
          path: |
            product/target/debug/*.exe
            product/target/debug/*.dll
      - name: Build the Windows editor
        if: steps.binary.outputs.cache-hit != 'true'
        working-directory: product
        run: cargo build --locked -p zed --bin zed
      - name: Keep the built editor for reruns
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: notebook-gui-zed-debug-${{ env.PRODUCT_SHA }}
          path: |
            product/target/debug/*.exe
            product/target/debug/*.dll
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create the notebook project and its Python environment
        shell: pwsh
        run: |
          $proof = New-Item -ItemType Directory -Force (Join-Path $env:NOTEBOOK_ROOT 'proof')
          $project = New-Item -ItemType Directory -Force (Join-Path $env:NOTEBOOK_ROOT 'project')
          $config = New-Item -ItemType Directory -Force (Join-Path $env:NOTEBOOK_ROOT 'profile/config')
          '{"enable_language_server": false, "show_completions_on_input": false, "auto_update": false, "telemetry": {"diagnostics": false, "metrics": false}}' |
            Set-Content -Encoding utf8NoBOM (Join-Path $config 'settings.json')
          $exe = Join-Path $env:GITHUB_WORKSPACE 'product/target/debug/zed.exe'
          "ZED_EXE=$exe" >> $env:GITHUB_ENV
          $binary = Join-Path $proof 'binary.txt'
          "Binary cache hit: ${{ steps.binary.outputs.cache-hit }}" | Tee-Object -Append $binary
          "Product: $(git -C product rev-parse HEAD)" | Tee-Object -Append $binary
          "zed.exe SHA-256: $((Get-FileHash $exe).Hash)" | Tee-Object -Append $binary
          "zed.exe written: $((Get-Item $exe).LastWriteTimeUtc.ToString('o'))" | Tee-Object -Append $binary
          $venv = Join-Path $project '.venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the project environment' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -I -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple 'ipykernel==7.4.0' 'matplotlib==3.11.2'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install ipykernel and matplotlib' }
          & $python -I -c "import matplotlib.pyplot"
          $checker = Join-Path $env:RUNNER_TEMP 'notebook-checker'
          python -m venv $checker
          $checkerPython = Join-Path $checker 'Scripts/python.exe'
          & $checkerPython -I -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple nbformat pillow
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the file checker' }
          "CHECKER=$checkerPython" >> $env:GITHUB_ENV
          & $checkerPython -I harness/.github/notebook-gui/fixture.py create
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the notebook' }
      - name: Edit, run, save, stop and reopen in the Zed window
        shell: pwsh
        env:
          ZED_DISABLE_STAFF: '1'
        run: |
          $venv = Join-Path $env:NOTEBOOK_ROOT 'project/.venv'
          $env:VIRTUAL_ENV = $venv
          $env:PATH = "$(Join-Path $venv 'Scripts');$env:PATH"
          ./harness/.github/notebook-gui/drive.ps1
      - name: Check the saved notebook on disk
        shell: pwsh
        run: |
          & $env:CHECKER -I harness/.github/notebook-gui/fixture.py check | Tee-Object (Join-Path $env:NOTEBOOK_ROOT 'proof/check.txt')
          if ($LASTEXITCODE -ne 0) { throw 'The saved notebook did not pass' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: notebook-window-evidence
          path: |
            ${{ runner.temp }}/notebook-gui/proof
            ${{ runner.temp }}/notebook-gui/profile/logs
          if-no-files-found: ignore
          retention-days: 7
