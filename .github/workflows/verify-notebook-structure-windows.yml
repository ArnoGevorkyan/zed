name: Verify notebook cell structure on Windows
on:
  push:
    branches: [capy/verify-notebook-structure-3d70c1b3]
permissions:
  contents: read
env:
  PRODUCT_SHA: '3d70c1b3e8e27303fac433d90e8ff113f59b67e4'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
jobs:
  windows:
    if: github.repository == 'ArnoGevorkyan/zed'
    strategy:
      fail-fast: false
      matrix:
        check: [suite, window]
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ env.PRODUCT_SHA }}
          path: product
          persist-credentials: false
      - name: Verify hosted runner and product
        run: |
          if ((git -C product rev-parse HEAD) -ne $env:PRODUCT_SHA) { throw 'Unexpected checkout' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires a GitHub-hosted runner' }
          git -C product log -1 --format='%H %s'
          "Runner: $env:RUNNER_NAME ($env:ImageOS $env:ImageVersion)"
      - name: Run the full REPL library suite
        if: matrix.check == 'suite'
        working-directory: product
        run: cargo test --locked -p repl --lib
      - name: Restore the binary for an exact-head rerun
        if: matrix.check == 'window'
        id: binary
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: notebook-structure-debug-${{ env.PRODUCT_SHA }}
          path: |
            product/target/debug/*.exe
            product/target/debug/*.dll
      - name: Build the editor
        if: matrix.check == 'window' && steps.binary.outputs.cache-hit != 'true'
        working-directory: product
        run: cargo build --locked -p zed --bin zed
      - name: Cache the binary before running the GUI
        if: matrix.check == 'window' && steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: notebook-structure-debug-${{ env.PRODUCT_SHA }}
          path: |
            product/target/debug/*.exe
            product/target/debug/*.dll
      - name: Prepare two local notebooks
        if: matrix.check == 'window'
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'notebook-structure'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'product/target/debug/zed.exe'
          $env:NOTEBOOK_ROOT = $root
          "NOTEBOOK_ROOT=$root" >> $env:GITHUB_ENV
          "ZED_EXE=$exe" >> $env:GITHUB_ENV
          python -I harness/.github/notebook-gui/fixture.py create
          if ($LASTEXITCODE -ne 0) { throw 'Fixture creation failed' }
          "product=$env:PRODUCT_SHA exe=$((Get-FileHash $exe).Hash) cache=${{ steps.binary.outputs.cache-hit }}" | Tee-Object "$root/proof/binary.txt"
      - name: Drive the default Windows shortcuts
        if: matrix.check == 'window'
        env:
          ZED_DISABLE_STAFF: '1'
        run: ./harness/.github/notebook-gui/drive.ps1
      - name: Independently parse every saved state
        if: matrix.check == 'window'
        run: |
          python -I harness/.github/notebook-gui/fixture.py check | Tee-Object "$env:NOTEBOOK_ROOT/proof/check.txt"
          if ($LASTEXITCODE -ne 0) { throw 'The saved files did not match the GUI edits' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && matrix.check == 'window'
        with:
          name: windows-cell-structure-${{ env.PRODUCT_SHA }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/notebook-structure/proof
            ${{ runner.temp }}/notebook-structure/profile*/logs
