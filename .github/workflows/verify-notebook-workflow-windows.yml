name: Verify Python notebook workflow on Windows
on:
  push:
    branches: [capy/verify-notebook-repair-a3cdac3d]
permissions:
  contents: read
jobs:
  notebook:
    if: github.repository == 'ArnoGevorkyan/zed'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: a3cdac3d5d5cc07b732499116bc3de0177755e1f
          persist-credentials: false
      - name: Verify product revision
        id: verify_product
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'a3cdac3d5d5cc07b732499116bc3de0177755e1f') { throw 'Unexpected checkout' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires standard hosted runner' }
          [Environment]::OSVersion.VersionString
          git log -1 --oneline
      - name: Test notebook source, trust, execution and saved plot
        run: cargo test --locked -p repl --lib
      - name: Install isolated Python and verify chart
        if: ${{ !cancelled() && steps.verify_product.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test --locked -p repl --lib install_and_reuse_a_working_notebook_kernel -- --ignored | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or -not ($result -match 'test result: ok\. 1 passed')) { throw 'Managed install and chart test did not pass' }
      - name: Check sibling imports with a local Python kernel
        if: ${{ !cancelled() && steps.verify_product.outcome == 'success' }}
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'notebook-repair-venv'
          python -I -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the test environment' }
          $env:ZED_NOTEBOOK_TEST_PYTHON = Join-Path $venv 'Scripts/python.exe'
          & $env:ZED_NOTEBOOK_TEST_PYTHON -I -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple 'ipykernel==7.4.0'
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the test kernel' }
          cargo test --locked -p repl --lib notebook_kernel_imports_siblings_after_startup -- --ignored | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0 -or -not ($result -match 'test result: ok\. 1 passed')) { throw 'Sibling import test did not pass' }
