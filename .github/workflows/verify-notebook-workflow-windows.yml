name: Verify Python notebook workflow on Windows
on:
  push:
    branches: [capy/verify-notebook-workflow-f349827]
permissions:
  contents: read
jobs:
  notebook:
    if: github.repository == 'ArnoGevorkyan/zed'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: f3498276d6065df4571b389424214fcc27bee214
          persist-credentials: false
      - name: Verify product revision
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'f3498276d6065df4571b389424214fcc27bee214') { throw 'Unexpected checkout' }
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires standard hosted runner' }
          [Environment]::OSVersion.VersionString
          git log -1 --oneline
      - name: Test notebook source, trust, execution and saved plot
        run: cargo test --locked -p repl --lib
      - name: Install isolated Python and verify chart
        run: cargo test --locked -p repl --lib install_and_reuse_a_working_notebook_kernel -- --ignored
