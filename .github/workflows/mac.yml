name: Verify native notebook structure on hosted macOS
on:
  push:
    branches: [capy/verify-macos-structure-3d70c1b3]
permissions:
  contents: read
concurrency: mac-structure-3d70c1b3
jobs:
  desktop:
    if: github.repository == 'ArnoGevorkyan/zed'
    runs-on: macos-15
    timeout-minutes: 100
    env:
      PRODUCT_SHA: 3d70c1b3e8e27303fac433d90e8ff113f59b67e4
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: 3d70c1b3e8e27303fac433d90e8ff113f59b67e4
          path: product
          persist-credentials: false
      - name: Identify pinned product and hosted Mac
        id: host
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          root="$RUNNER_TEMP/notebook"
          mkdir -p "$root/proof"
          echo "NOTEBOOK_ROOT=$root" >> "$GITHUB_ENV"
          echo "ZED_EXE=$GITHUB_WORKSPACE/product/target/debug/zed" >> "$GITHUB_ENV"
          {
            git -C product rev-parse HEAD; sw_vers; uname -m; df -h .
            xcodebuild -version; cmake --version; stat -f 'console user: %Su' /dev/console
            system_profiler SPDisplaysDataType
          } | tee "$root/proof/host.txt"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare notebook fixtures and probe desktop permissions
        id: probe
        run: |
          python -m pip install --only-binary=:all: pyobjc-framework-Quartz pyobjc-framework-Metal psutil
          python -I harness/fixture.py create
          python -I harness/drive.py probe | tee "$NOTEBOOK_ROOT/proof/desktop-probe.txt"
      - name: Restore the pinned build
        id: cache
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: mac15-arm-notebook-${{ env.PRODUCT_SHA }}-v1
          path: product/target/debug/zed
      - name: Compile Metal shader toolchain check
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: |
          if ! xcrun metal --version; then xcodebuild -downloadComponent MetalToolchain && xcrun metal --version; fi
      - name: Build the exact macOS editor
        id: build
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        working-directory: product
        run: |
          if [[ "${{ steps.cache.outputs.cache-hit }}" != true ]]; then cargo build --locked -p zed --bin zed; fi
          { file "$ZED_EXE"; shasum -a 256 "$ZED_EXE"; } | tee "$NOTEBOOK_ROOT/proof/binary.txt"
      - name: Cache the built editor for harness corrections
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: mac15-arm-notebook-${{ env.PRODUCT_SHA }}-v1
          path: product/target/debug/zed
      - name: Add, move, delete, undo and save in the real window
        id: gui
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.probe.outcome == 'success' }}
        working-directory: product
        timeout-minutes: 8
        run: |
          python -I -u ../harness/drive.py gui 2>&1 | tee "$NOTEBOOK_ROOT/proof/desktop.txt"
          python -I ../harness/fixture.py check | tee "$NOTEBOOK_ROOT/proof/check.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hosted-mac-structure-3d70c1b3
          path: ${{ runner.temp }}/notebook/proof
          retention-days: 7
